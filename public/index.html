<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Sable</title>

		<!-- Logo, also used as the favicon. Swap both copies for your own Sable logo if you like. -->
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M16 5 27 16 16 27 5 16Z' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E"
		/>

		<!-- Apply the saved light/dark choice before the page paints -->
		<script>
			try {
				if (localStorage.getItem("sable-theme") === "light")
					document.documentElement.dataset.theme = "light";
			} catch {}
		</script>

		<!-- Scramjet engine: leave these exactly as they are -->
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>

		<style>
			/* ---------- Colors and fonts: change the look here ---------- */
			:root {
				--page: #000000; /* background behind the window */
				--dot: rgba(255, 255, 255, 0.42); /* the small dots */
				--panel: #08080a; /* the window */
				--line: #2b2b30; /* borders */
				--text: #ececec;
				--dim: #8d8d96;
				--glow: rgba(255, 255, 255, 0.4);
				--error: #ff4040;

				--retro: "Lucida Console", "Courier New", Courier, monospace;
				--modern: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

				--gap: clamp(14px, 3.2vw, 44px); /* space around the window */
				--bar: 58px; /* height of the top bar */
				--radius: 6px;
			}
			:root[data-theme="light"] {
				--page: #efefea;
				--dot: rgba(0, 0, 0, 0.3);
				--panel: #ffffff;
				--line: #c9c9c4;
				--text: #141414;
				--dim: #63636b;
				--glow: rgba(0, 0, 0, 0);
				--error: #d81e1e;
			}
			/* Theater mode: the window fills the whole screen */
			:root.theater {
				--gap: 0px;
				--radius: 0px;
			}

			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				overflow: hidden;
				color: var(--text);
				font: 15px/1.5 var(--retro);
				background-color: var(--page);
				background-image: radial-gradient(var(--dot) 1px, transparent 1.6px);
				background-size: 26px 26px;
			}

			/* ---------- The window ---------- */
			.window {
				position: fixed;
				inset: var(--gap);
				display: flex;
				flex-direction: column;
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: var(--radius);
				overflow: hidden;
			}

			/* ---------- Top bar ---------- */
			.bar {
				flex: none;
				height: var(--bar);
				display: flex;
				align-items: center;
				gap: 14px;
				padding: 0 14px;
				border-bottom: 1px solid var(--line);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 10px;
				color: inherit;
				text-decoration: none;
				font: 600 19px/1 var(--modern); /* the title stays modern, not retro */
				letter-spacing: -0.01em;
			}
			.brand svg {
				width: 28px;
				height: 28px;
				flex: none;
			}
			#sj-form {
				flex: 1;
				min-width: 0;
				display: flex;
				gap: 8px;
			}
			#sj-address {
				flex: 1;
				min-width: 0;
				height: 36px;
				padding: 0 12px;
				color: var(--text);
				background: transparent;
				border: 1px solid var(--line);
				border-radius: 4px;
				font: inherit;
			}
			#sj-address::placeholder {
				color: var(--dim);
			}
			.tools {
				display: flex;
				gap: 8px;
			}
			button {
				height: 36px;
				padding: 0 12px;
				color: var(--text);
				background: transparent;
				border: 1px solid var(--line);
				border-radius: 4px;
				font: inherit;
				cursor: pointer;
				white-space: nowrap;
			}
			button:hover {
				border-color: var(--text);
			}
			button[hidden] {
				display: none;
			}
			button[aria-pressed="true"] {
				color: var(--panel);
				background: var(--text);
				border-color: var(--text);
			}
			:focus-visible {
				outline: 2px solid var(--text);
				outline-offset: 2px;
			}

			/* ---------- Empty screen ---------- */
			.stage {
				flex: 1;
				min-height: 0;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 24px clamp(20px, 6vw, 84px);
				overflow: auto;
			}
			h1 {
				margin: 0 0 14px;
				font: 400 clamp(34px, 7vw, 76px) / 1.05 var(--retro);
				text-shadow: 0 0 16px var(--glow); /* the slight white glow */
			}
			.cursor {
				display: inline-block;
				width: 0.55em;
				height: 0.9em;
				margin-left: 0.12em;
				vertical-align: -0.08em;
				background: currentColor;
				box-shadow: 0 0 16px var(--glow);
				animation: blink 1.1s steps(1) infinite;
			}
			@keyframes blink {
				50% {
					opacity: 0;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.cursor {
					animation: none;
				}
			}
			.hint {
				max-width: 52ch;
				margin: 0;
				color: var(--dim);
			}

			/* Errors: plain red, slightly glowing, retro */
			#sj-error,
			#sj-error-code {
				max-width: 80ch;
				margin: 18px 0 0;
				color: var(--error);
				font: inherit;
				text-shadow: 0 0 9px color-mix(in srgb, var(--error) 55%, transparent);
				white-space: pre-wrap;
				overflow-wrap: anywhere;
			}
			#sj-error:empty,
			#sj-error-code:empty {
				display: none;
			}

			.credits {
				flex: none;
				padding: 10px 14px;
				border-top: 1px solid var(--line);
				color: var(--dim);
				font-size: 12px;
			}
			.credits a {
				color: inherit;
			}
			.credits a:hover {
				color: var(--text);
			}

			/* ---------- The site you open ----------
			   Scramjet adds its frame to the page; this places it inside the
			   window, under the top bar, so the dotted background stays visible. */
			body > iframe {
				position: fixed;
				top: calc(var(--gap) + var(--bar) + 1px);
				left: calc(var(--gap) + 1px);
				width: calc(100vw - 2 * var(--gap) - 2px);
				height: calc(100vh - 2 * var(--gap) - var(--bar) - 2px);
				height: calc(100dvh - 2 * var(--gap) - var(--bar) - 2px);
				border: 0;
				border-radius: 0 0 calc(var(--radius) - 1px) calc(var(--radius) - 1px);
				background: #fff;
			}

			/* ---------- Small screens: address bar drops to its own row ---------- */
			@media (max-width: 640px) {
				:root {
					--bar: 104px;
				}
				.bar {
					flex-wrap: wrap;
					align-content: center;
					justify-content: space-between;
					gap: 8px;
				}
				#sj-form {
					order: 3;
					flex: 0 0 100%;
				}
				button {
					padding: 0 9px;
					font-size: 13px;
				}
				.brand span {
					display: none; /* logo only, so the buttons fit on one row */
				}
			}
		</style>
	</head>

	<body>
		<div class="window">
			<header class="bar">
				<a class="brand" href="/" title="Back to the start">
					<svg viewBox="0 0 32 32" aria-hidden="true">
						<rect width="32" height="32" rx="7" fill="#000" />
						<path
							d="M16 5 27 16 16 27 5 16Z"
							fill="none"
							stroke="#fff"
							stroke-width="2.5"
						/>
						<circle cx="16" cy="16" r="3" fill="#fff" />
					</svg>
					<span>Sable</span>
				</a>

				<!-- Scramjet looks for these ids: keep sj-form, sj-search-engine and sj-address -->
				<form id="sj-form">
					<input
						id="sj-search-engine"
						value="https://www.google.com/search?q=%s"
						type="hidden"
					/>
					<input
						id="sj-address"
						type="text"
						placeholder="Search or type a web address"
						aria-label="Search or type a web address"
						autocomplete="off"
						autocapitalize="off"
						spellcheck="false"
						autofocus
					/>
					<button type="submit">Go</button>
				</form>

				<div class="tools">
					<button id="clear-btn" type="button" hidden>Clear</button>
					<button id="theater-btn" type="button" aria-pressed="false">Theater</button>
					<button id="theme-btn" type="button">Light</button>
				</div>
			</header>

			<main class="stage">
				<h1>Where to?<span class="cursor" aria-hidden="true"></span></h1>
				<p class="hint">
					Type a web address or a search in the bar above, then press Enter.
				</p>
				<!-- Scramjet writes error messages into these two -->
				<p id="sj-error"></p>
				<pre id="sj-error-code"></pre>
			</main>

			<footer class="credits">
				Runs on
				<a href="https://github.com/MercuryWorkshop/scramjet">Scramjet</a>
				by Mercury Workshop. <a href="credits.html">Credits and licenses</a>
			</footer>
		</div>

		<script>
			// Sable's own buttons. Scramjet's code (index.js) is untouched.
			(() => {
				const root = document.documentElement;
				const address = document.getElementById("sj-address");
				const clearBtn = document.getElementById("clear-btn");
				const theaterBtn = document.getElementById("theater-btn");
				const themeBtn = document.getElementById("theme-btn");

				// Light / dark
				const showTheme = () => {
					themeBtn.textContent = root.dataset.theme === "light" ? "Dark" : "Light";
				};
				showTheme();
				themeBtn.addEventListener("click", () => {
					const next = root.dataset.theme === "light" ? "dark" : "light";
					root.dataset.theme = next;
					try {
						localStorage.setItem("sable-theme", next);
					} catch {}
					showTheme();
				});

				// Theater mode
				theaterBtn.addEventListener("click", () => {
					const on = root.classList.toggle("theater");
					theaterBtn.setAttribute("aria-pressed", String(on));
				});

				// The frames Scramjet has added to the page
				const frames = () =>
					[...document.body.children].filter((el) => el.tagName === "IFRAME");

				// Clear: take the current site off the screen
				clearBtn.addEventListener("click", () => {
					frames().forEach((frame) => frame.remove());
					address.value = "";
					address.focus();
				});

				// Each search adds a new frame. Keep only the newest one, so old
				// sites do not keep running (and playing sound) underneath.
				new MutationObserver(() => {
					const all = frames();
					all.slice(0, -1).forEach((frame) => frame.remove());
					clearBtn.hidden = all.length === 0;
				}).observe(document.body, { childList: true });
			})();
		</script>
	</body>
</html>
